# Training parameters for hybrid physics-augmented world model

network:
  # State and action dimensions
  state_dim: 8          # [phi, theta, Va, p, q, r, alpha, beta]
  action_dim: 3         # [delta_a, delta_e, throttle]
  prev_action_dim: 2      # [prev_aileron_cmd, prev_elevator_cmd] from s_t_10, s_t_11
  hidden_dims: [256,256]
  activation: elu


training:
  # Trajectory prediction horizon (number of simulation steps)
  # Each step is 0.01 seconds, so horizon=20 means 0.2 seconds prediction
  horizon: 10
  
  # Batch parameters
  batch_size: 1024
  num_epochs: 1000
  
  # Actual learning rate is set via aphynity.tau_1 (passed to Adam optimizer)
  
  # Learning rate scheduler (optional)
  scheduler:
    enabled: true
    type: 'cosine'
    min_lr: 0.0001
  
  # Gradient clipping — set high (effectively no clip) per APHYNITY paper
  grad_clip_norm: 5.0
  
  # Validation frequency
  val_freq: 1           # Validate every epoch
  checkpoint_freq: 10   # Save checkpoint every N epochs



aphynity:
  # Learning rate coefficient (handled by Adam optimizer)
  tau_1: 0.001            # Learning rate for Adam optimizer (official APHYNITY pendulum uses 1e-3)
                          # Passed to optimizer, NOT applied as gradient scaling
  # Lagrange multiplier initialization and update
  lambda_init: 1.0        # Initial λ (balanced: reg=1.0, trajectory_loss weighted by λ)
  tau_2: 0.01                # Step size for dual ascent: λ_{j+1} = λ_j + τ_2 * L_traj (per-batch)
  
  # Lagrange multiplier bounds — no upper bound per APHYNITY paper
  lambda_max: 100000
  lambda_min: 0.01


integration:
  # Simulation step size (100 Hz environment)
  dt: 0.01
  
  # Integration method for HybridDynamicsModel
  # Options: 
  #   'rk4' - 4th order Runge-Kutta (faster, adequate accuracy for training)
  #   'dopri8' - 8th order (slower, higher accuracy, better for fine-tuned testing)
  method: rk4
  
  # For adaptive step solvers (torchdiffeq odeint parameters)
  rtol: 1.0e-5
  atol: 1.0e-6


data:
  # CSV file located in fw_flightcontrol/data/
  file: 'trajectory_data_pid_converged.csv'

  # Train/val/test split
  train_fraction: 0.85
  val_fraction: 0.1
  test_fraction: 0.05
  
  # Normalization type for residual network inputs and loss computation.
  # 'data_driven_normalization': normalize by (x - mean) / std, computed from training data.
  # absent / null:               no normalization.
  normalization_type: 'data_driven_normalization'

  # Sequence sampling
  random_seed: 0
  shuffle: true


regularization:
  weight_decay: 0.0


logging:
  verbose: true
  log_freq: 10          
  tensorboard: true
  
  # Output directories
  checkpoint_dir: checkpoints
  checkpoint_subdirectory: updated_residualv2
  log_dir: ./logs
