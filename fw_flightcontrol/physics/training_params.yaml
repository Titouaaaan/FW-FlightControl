# Training parameters for hybrid physics-augmented world model
# This config controls all aspects of APHYNITY training

# ============================================================================
# NETWORK ARCHITECTURE
# ============================================================================
network:
  # State and action dimensions
  state_dim: 8          # [phi, theta, Va, p, q, r, alpha, beta]
  action_dim: 3         # [delta_a, delta_e, throttle]
  
  # Residual network hidden layers
  hidden_dims: [256,256]
  activation: relu
  use_batch_norm: false


# ============================================================================
# TRAINING HYPERPARAMETERS
# ============================================================================
training:
  # Trajectory prediction horizon (number of simulation steps)
  # Each step is 0.01 seconds, so horizon=20 means 0.2 seconds prediction
  horizon: 10
  
  # Batch parameters
  batch_size: 25
  num_epochs: 1000
  
  # Actual learning rate is set via aphynity.tau_1 (passed to Adam optimizer)
  
  # Learning rate scheduler (optional)
  scheduler:
    enabled: true
    type: 'steplr'        # Options: 'steplr', 'exponential', 'cosine'
    step_size: 20         # Decay every N epochs
    gamma: 0.7            # Multiply LR by this factor (0.7 = 30% reduction per step)
    min_lr: 0.0001        # Floor - don't go below this
  
  # Gradient clipping for stability
  grad_clip_norm: 3.0
  
  # Validation frequency
  val_freq: 1           # Validate every epoch
  checkpoint_freq: 10   # Save checkpoint every N epochs


# ============================================================================
# APHYNITY DUAL ASCENT PARAMETERS
# ============================================================================
aphynity:
  # Learning rate coefficient (handled by Adam optimizer)
  tau_1: 0.001            # Learning rate for Adam optimizer (official APHYNITY pendulum uses 1e-3)
                          # Passed to optimizer, NOT applied as gradient scaling
  # Lagrange multiplier initialization and update
  lambda_init: 1.0        # Initial λ (balanced: reg=1.0, trajectory_loss weighted by λ)
  tau_2: 0.005              # Step size for dual ascent: λ_{j+1} = λ_j + τ_2 * L_traj
                          # Conservative value; can increase to 1.0 after verifying numerical stability
  
  # Lagrange multiplier bounds
  # NOTE: Official APHYNITY has NO upper bound - lambda grows naturally
  # Setting to high value for safety (detects pathological loss explosion only)
  lambda_max: 100000.0      
  lambda_min: 0.01         # Prevent numerical issues at very low values


# ============================================================================
# ODE INTEGRATION SETTINGS
# ============================================================================
integration:
  # Simulation step size (100 Hz environment)
  dt: 0.01
  
  # Integration method for HybridDynamicsModel
  # Options: 
  #   'rk4' - 4th order Runge-Kutta (faster, adequate accuracy for training)
  #   'dopri8' - 8th order (slower, higher accuracy, better for fine-tuned testing)
  method: rk4
  
  # For adaptive step solvers (torchdiffeq odeint parameters)
  rtol: 1.0e-5
  atol: 1.0e-6


# ============================================================================
# DATA HANDLING
# ============================================================================
data:
  # Train/val/test split
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  
  # Data normalization (physics prior always works in raw space; this controls residual network)
  # false: residual learns in raw space, combines directly with physics prior
  # true: residual learns in normalized [-1,1] space, derivatives denormalized before combining
  normalize: false

  # Per-state loss normalization for trajectory loss
  # When true, trajectory errors are scaled by per-state half-range (denorm_factors)
  per_state_loss_norm: false
  
  # Sequence sampling
  random_seed: 42
  shuffle: true


# ============================================================================
# STATE BOUNDS FOR NORMALIZATION
# ============================================================================
# Bounds used for min-max normalization: normalized = 2*(value - min)/(max - min) - 1
# State order: [roll, pitch, airspeed_mps, p, q, r, alpha, beta]
# Note: Airspeed bounds are in m/s (after conversion from km/h in CSV)
state_bounds:
  # Attitude angles [rad]
  roll_min: -3.14159265
  roll_max: 3.14159265
  
  pitch_min: -3.14159265
  pitch_max: 3.14159265
  
  # Airspeed [m/s] - bounds after conversion from km/h
  # Environment: [0, 400 km/h] → [0, 111.1 m/s]
  airspeed_mps_min: 0.0
  airspeed_mps_max: 111.1
  
  # Angular rates [rad/s] - from environment (jsbsim_properties.py)
  p_min: -35.0
  p_max: 35.0
  
  q_min: -35.0
  q_max: 35.0
  
  r_min: -35.0
  r_max: 35.0
  
  # Aerodynamic angles [rad] - compromise between environment (unbounded) and empirical data
  # Symmetric bounds: approximately ±20° = ±0.349 rad
  alpha_min: -0.35
  alpha_max: 0.35
  
  beta_min: -0.35
  beta_max: 0.35


# ============================================================================
# REGULARIZATION
# ============================================================================
regularization:
  # L2 weight decay on residual network
  weight_decay: 0.0


# ============================================================================
# LOGGING AND CHECKPOINTING
# ============================================================================
logging:
  verbose: true
  log_freq: 10          # Log metrics every N batches
  tensorboard: true
  
  # Output directories
  checkpoint_dir: ./checkpoints
  checkpoint_subdirectory: exp_normalization_and_per_state_loss_penalty # per_state_norm_expv.0.8    
  log_dir: ./logs
