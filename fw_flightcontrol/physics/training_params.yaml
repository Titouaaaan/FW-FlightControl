network:
  state_dim: 8          # [phi, theta, Va, p, q, r, alpha, beta]
  action_dim: 3         # [delta_a, delta_e, throttle]
  
  hidden_dims: [256,256]
  activation: relu
  use_batch_norm: false


training:
  # Each step is 0.01 seconds, so horizon=20 means 0.2 seconds prediction
  horizon: 10
  batch_size: 256
  num_epochs: 1000
  
  scheduler:
    enabled: true
    type: 'steplr'
    step_size: 20
    gamma: 0.7
    min_lr: 0.0001

  grad_clip_norm: 3.0
  val_freq: 1           
  checkpoint_freq: 10   


aphynity:
  tau_1: 0.001            # Learning rate for Adam optimizer 
  lambda_init: 1.0       
  tau_2: 0.01              # Step size for dual ascent: λ_{j+1} = λ_j + τ_2 * L_traj

  lambda_max: 100000.0      
  lambda_min: 0.01         


integration:
  dt: 0.01  # Simulation step size (100 Hz environment)
  method: rk4 # dopri8 also works but is more costly
  rtol: 1.0e-5
  atol: 1.0e-6

data:
  train_fraction: 0.85
  val_fraction: 0.1
  test_fraction: 0.05
  
  random_seed: 0
  shuffle: true


logging:
  verbose: true
  log_freq: 10          
  tensorboard: true
  
  checkpoint_dir: ./checkpoints
  checkpoint_subdirectory: REPRODUCE_MODELv2
  log_dir: ./logs
