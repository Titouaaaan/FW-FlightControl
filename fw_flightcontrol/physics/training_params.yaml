# Training parameters for hybrid physics-augmented world model
# This config controls all aspects of APHYNITY training

# ============================================================================
# NETWORK ARCHITECTURE
# ============================================================================
network:
  # State and action dimensions
  state_dim: 8          # [phi, theta, Va, p, q, r, alpha, beta]
  action_dim: 3         # [delta_a, delta_e, throttle]
  
  # Residual network hidden layers
  hidden_dims: [128,128]
  activation: relu      # Options: relu, tanh, elu
  use_batch_norm: false
  
  # Weight initialization
  init_mean: 0.0
  init_std: 0.005       # Very small initialization to prevent early gradient explosion


# ============================================================================
# TRAINING HYPERPARAMETERS
# ============================================================================
training:
  # Trajectory prediction horizon (number of simulation steps)
  # Each step is 0.01 seconds, so horizon=20 means 0.2 seconds prediction
  horizon: 10
  
  # Batch parameters
  batch_size: 25
  num_epochs: 1000
  
  # Learning rate and optimizer
  learning_rate: 0.001
  optimizer: adam
  
  # Learning rate scheduler (optional)
  scheduler:
    enabled: true
    type: 'steplr'        # Options: 'steplr', 'exponential', 'cosine'
    step_size: 20         # Decay every N epochs
    gamma: 0.7            # Multiply LR by this factor (0.7 = 30% reduction per step)
    min_lr: 0.0001        # Floor - don't go below this
  
  # Gradient clipping for stability
  grad_clip_norm: 3.0
  
  # Validation frequency
  val_freq: 1           # Validate every epoch
  checkpoint_freq: 10   # Save checkpoint every N epochs


# ============================================================================
# APHYNITY DUAL ASCENT PARAMETERS
# ============================================================================
aphynity:
  # Learning rate coefficient (handled by Adam optimizer)
  tau_1: 0.001            # Learning rate for Adam optimizer (official APHYNITY pendulum uses 1e-3)
                          # Passed to optimizer, NOT applied as gradient scaling
  # Lagrange multiplier initialization and update
  lambda_init: 1.0        # Initial λ (balanced: reg=1.0, trajectory_loss weighted by λ)
  tau_2: 0.1              # Step size for dual ascent: λ_{j+1} = λ_j + τ_2 * L_traj
                          # Conservative value; can increase to 1.0 after verifying numerical stability
  
  # Lagrange multiplier bounds
  # NOTE: Official APHYNITY has NO upper bound - lambda grows naturally
  # Setting to high value for safety (detects pathological loss explosion only)
  lambda_max: 1000.0      # Effectively unbounded; grows naturally via dual ascent
  lambda_min: 0.1         # Prevent numerical issues at very low values


# ============================================================================
# ODE INTEGRATION SETTINGS
# ============================================================================
integration:
  # Simulation step size (100 Hz environment)
  dt: 0.01
  
  # Integration method for HybridDynamicsModel
  # Options: 
  #   'rk4' - 4th order Runge-Kutta (faster, adequate accuracy for training)
  #   'dopri8' - 8th order (slower, higher accuracy, better for fine-tuned testing)
  method: rk4
  
  # For adaptive step solvers (torchdiffeq odeint parameters)
  rtol: 1.0e-5
  atol: 1.0e-6


# ============================================================================
# DATA HANDLING
# ============================================================================
data:
  # Train/val/test split
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  
  # Data normalization (disabled - physics prior works in raw physical units)
  normalize: false
  normalize_method: standard  # Options: standard (z-score), minmax
  
  # Hierarchical sampling strategy based on trajectory step
  # Rationale: Most dynamics happen early (0-200), medium change (200-400),
  # low change (400-600), ignore beyond 600 (settled/stale data)
  sampling_strategy:
    enabled: true
    # Step ranges for sampling tiers
    early_steps_threshold: 200      # Range: [0, 200]
    medium_steps_threshold: 400     # Range: [200, 400]
    late_steps_threshold: 600       # Range: [400, 600]
    max_step_threshold: 600         # Ignore windows starting at step >= this
    
    # Sampling probabilities for each tier
    early_probability: 0.8          # High priority: most dynamics
    medium_probability: 0.5         # Medium priority: moderate dynamics
    late_probability: 0.2           # Low priority: settled dynamics
  
  # Sequence sampling
  random_seed: 42
  shuffle: true


# ============================================================================
# REGULARIZATION
# ============================================================================
regularization:
  # L2 weight decay on residual network
  weight_decay: 0.0
  
  # Early stopping patience (epochs without improvement)
  early_stopping_patience: 20
  early_stopping_metric: val_loss


# ============================================================================
# LOGGING AND CHECKPOINTING
# ============================================================================
logging:
  verbose: true
  log_freq: 10          # Log metrics every N batches
  tensorboard: true
  
  # Output directories
  checkpoint_dir: ./checkpoints
  checkpoint_subdirectory: exp_v0.2    # Subdirectory for this run (e.g., test1, test2, exp_v1)
  log_dir: ./logs
