network:
  state_dim: 8
  action_dim: 3
  hidden_dims: [256, 256]
  activation: elu
  prev_action_dim: 2

training:
  horizon: 10
  batch_size: 1024
  num_epochs: 1000
  scheduler:
    enabled: true
    min_lr: 0.0001
  grad_clip_norm: 5.0
  val_freq: 1
  checkpoint_freq: 10

aphynity:
  tau_1: 0.001
  lambda_init: 1.0
  tau_2: 0.01
  lambda_max: 100000.0
  lambda_min: 0.01

integration:
  dt: 0.01
  method: rk4
  rtol: 1.0e-5
  atol: 1.0e-6

data:
  file: 'updated_trajectory_data_noatmo.csv'
  train_fraction: 0.85
  val_fraction: 0.1
  test_fraction: 0.05
  normalization_type: 'data_driven_normalization'
  random_seed: 0
  shuffle: true

regularization:
  weight_decay: 0.0

logging:
  verbose: true
  log_freq: 10
  tensorboard: true
  checkpoint_dir: ./checkpoints
  checkpoint_subdirectory: converged_data_elu_cosine
  log_dir: ./logs
