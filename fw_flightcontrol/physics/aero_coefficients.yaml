# Aerodynamic Coefficients for Skywalker X8
# Source: JSBSim 2020 x8.xml (primary) based on Gryte et al. 2018 measurements
# Reference: "Aerodynamic modeling of the Skywalker X8 Fixed-Wing Unmanned Aerial Vehicle"
# State variables: [phi, theta, Va, p, q, r, alpha, beta]
# Action variables: [delta_a (aileron), delta_e (elevator)]
# Note: All coefficients extracted from JSBSim 2020 flight dynamics model

# Lift coefficients (from JSBSim 2020 x8.xml) - EXACT VALUES
C_L0: 0.0867           # JSBSim 2020 x8.xml
C_L_alpha: 4.0203      # JSBSim 2020 x8.xml
C_L_delta_e: 0.2781    # JSBSim 2020 x8.xml
C_L_q: 3.87            # JSBSim 2020 x8.xml

# Drag coefficients (from JSBSim 2020 x8.xml) - EXACT VALUES
C_D0: 0.0197           # JSBSim 2020 x8.xml
C_D_alpha: 0.0791      # JSBSim 2020 x8.xml
C_D_delta_e: 0.0633    # JSBSim 2020 x8.xml

# Side force coefficients (from JSBSim 2020 x8.xml) - EXACT VALUES
C_Y0: 0.0              # JSBSim 2020 x8.xml
C_Y_beta: -0.2239      # JSBSim 2020 x8.xml
C_Y_p: -0.1374         # JSBSim 2020 x8.xml
C_Y_r: 0.0839          # JSBSim 2020 x8.xml
C_Y_delta_a: 0.0433    # JSBSim 2020 x8.xml

# Rolling moment coefficients (from JSBSim 2020 x8.xml) - EXACT VALUES
C_l0: 0.0              # JSBSim 2020 x8.xml
C_l_beta: -0.0849      # JSBSim 2020 x8.xml
C_l_p: -0.4042         # JSBSim 2020 x8.xml
C_l_r: 0.0555          # JSBSim 2020 x8.xml
C_l_delta_a: 0.1202    # JSBSim 2020 x8.xml

# Pitching moment coefficients (from JSBSim 2020 x8.xml) - EXACT VALUES
C_m0: 0.0227           # JSBSim 2020 x8.xml
C_m_alpha: -0.4629     # JSBSim 2020 x8.xml
C_m_q: -1.3012         # JSBSim 2020 x8.xml
C_m_delta_e: -0.2292   # JSBSim 2020 x8.xml

# Yawing moment coefficients (from JSBSim 2020 x8.xml) - EXACT VALUES
C_n0: 0.0              # JSBSim 2020 x8.xml
C_n_beta: 0.0283       # JSBSim 2020 x8.xml
C_n_p: 0.0044          # JSBSim 2020 x8.xml
C_n_r: -0.072          # JSBSim 2020 x8.xml
C_n_delta_a: -0.00339  # JSBSim 2020 x8.xml

# Aircraft physical parameters
g: 9.81           # m/s^2
rho: 1.225        # kg/m^3 (air density at sea level)

# Wing geometry (from JSBSim x8.xml)
S: 0.75           # m^2 (planform area / wing area, exact from sim config)
b: 2.1            # m (wingspan, exact from sim config)
c: 0.35714286     # m (mean chord, exact from sim config)

# Inertia tensor (kg*m^2)
# From JSBSim X8 aircraft model
J_x: 1.2290
J_y: 0.1702
J_z: 0.8808
J_xz: 0.9343

# Mass (kg) - empty weight
mass: 3.3640

# Propulsion
C_p: 26.244        # Direct thrust model: T = C_p * throttle (from JSBSim investigation)
                   # Max thrust at full throttle (1.0): 5.9 lbs = 26.244 N


