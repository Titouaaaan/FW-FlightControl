# Aerodynamic Coefficients for Skywalker X8
# Source: JSBSim 2020 x8.xml (primary) based on Gryte et al. 2018 measurements
# Reference: "Aerodynamic modeling of the Skywalker X8 Fixed-Wing Unmanned Aerial Vehicle"
# State variables: [phi, theta, Va, p, q, r, alpha, beta]
# Action variables: [delta_a (aileron), delta_e (elevator)]
# Note: All coefficients extracted from JSBSim 2020 flight dynamics model

# Lift coefficients (from JSBSim 2020 x8.xml)
C_L0: 0.08673557       # JSBSim 2020 ✓ matches Gryte WT (0.0867)
C_L_alpha: 4.02032824  # JSBSim 2020 ✓ matches Gryte WT (4.02)
C_L_delta_e: 0.27807362 # JSBSim 2020 ✓ matches Gryte WT (0.278)
C_L_q: 3.87            # JSBSim 2020 ✓ matches Gryte XFLR5 (3.87)

# Drag coefficients (from JSBSim 2020 x8.xml)
C_D0: 0.01970001       # JSBSim 2020 ✓ matches Gryte WT (0.0197)
C_D_alpha: 0.07909146  # JSBSim 2020 ✓ matches Gryte WT (0.0791)
C_D_alpha2: 1.05546999 # JSBSim 2020 ✓ matches Gryte WT (1.06) - quadratic term, not currently used
C_D_beta1: -0.00584298 # JSBSim 2020 ✓ matches Gryte WT (-0.00584) - not currently used
C_D_beta2: 0.14781193  # JSBSim 2020 ✓ matches Gryte WT (0.148) - not currently used
C_D_p: 0.0102          # JSBSim 2020 - not currently used
C_D_delta_e: 0.0633474 # JSBSim 2020 ✓ matches Gryte WT (0.0633)

# Side force coefficients (from JSBSim 2020 x8.xml)
C_Y0: 0.0              # JSBSim 2020 ✗ set to 0.0 (Gryte WT: 0.00316, XFLR5: 1.08E-08)
C_Y_beta: -0.22387216  # JSBSim 2020 ✓ matches Gryte WT (-0.224)
C_Y_p: -0.13735505     # JSBSim 2020 ✓ matches Gryte XFLR5 (-0.137)
C_Y_r: 0.08386877      # JSBSim 2020 ✓ matches Gryte XFLR5 (0.0839)
C_Y_delta_a: 0.0432764 # JSBSim 2020 ✓ matches Gryte WT (0.0433)
C_Y_delta_r: 0.0        # Not used (no rudder control)

# Rolling moment coefficients (from JSBSim 2020 x8.xml)
C_l0: 0.0              # JSBSim 2020 ✗ set to 0.0 (Gryte WT: 0.00413, XFLR5: 1.29E-07)
C_l_beta: -0.08489629  # JSBSim 2020 ✓ matches Gryte WT (-0.0849)
C_l_p: -0.404198       # JSBSim 2020 ✓ matches Gryte XFLR5 (-0.404)
C_l_r: 0.0555206       # JSBSim 2020 ✓ matches Gryte XFLR5 (0.0555)
C_l_delta_a: 0.12018814 # JSBSim 2020 ✓ matches Gryte WT (0.12)
C_l_delta_r: 0.0        # Not used (no rudder control)

# Pitching moment coefficients (from JSBSim 2020 x8.xml)
# NOTE: C_m0 and C_m_alpha are from JSBSim 2020, significantly different from Gryte paper!
C_m0: 0.0227           # JSBSim 2020 ✗ differs from Gryte WT (0.0302) & XFLR5 (0.00439)
C_m_alpha: -0.4629     # JSBSim 2020 ✗ differs from Gryte WT (-0.126) & XFLR5 (-0.227)
C_m_q: -1.30123704     # JSBSim 2020 ✓ matches Gryte XFLR5 (-1.3)
C_m_delta_e: -0.2292   # JSBSim 2020 ✗ differs from Gryte WT (-0.206) & XFLR5 (-0.325)
C_m_fp: -0.2168        # Not used (no flaps)

# Yawing moment coefficients (from JSBSim 2020 x8.xml)
C_n0: 0.0              # JSBSim 2020 ✗ set to 0.0 (Gryte WT: -0.000471, XFLR5: 1.51E-07)
C_n_beta: 0.0283       # JSBSim 2020 ✓ matches Gryte WT (0.0283)
C_n_p: 0.00436551      # JSBSim 2020 ✓ matches Gryte XFLR5 (0.00437)
C_n_r: -0.072          # JSBSim 2020 ✗ differs from Gryte XFLR5 (-0.012) - 6x larger!
C_n_delta_a: -0.00339  # JSBSim 2020 ✓ matches Gryte WT (-0.00339)
C_n_delta_r: 0.0        # Not used (no rudder control)

# Aircraft physical parameters
g: 9.81           # m/s^2
rho: 1.225        # kg/m^3 (air density at sea level)

# Wing geometry (from JSBSim x8.xml)
S: 0.75           # m^2 (planform area / wing area, exact from sim config)
b: 2.1            # m (wingspan, exact from sim config)
c: 0.35714286     # m (mean chord, exact from sim config)

# Inertia tensor (kg*m^2)
# From JSBSim X8 aircraft model
J_x: 1.2290
J_y: 0.1702
J_z: 0.8808
J_xz: 0.9343

# Mass (kg) - empty weight
mass: 3.3640

# Propulsion
C_p: 5.9          # thrust coefficient (T_p = C_p * delta_t where delta_t in [0,1])

# Throttle (DEPRECATED - now dynamic from action[2] in the physics model)
# This value is no longer used; throttle is extracted from the 3rd action dimension at runtime
throttle: 0.5     # [DEPRECATED] kept for reference only


